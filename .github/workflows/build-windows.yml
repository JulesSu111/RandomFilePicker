name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name RandomFilePicker --add-data "locales:locales" app.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: RandomFilePicker-Windows
          path: dist/RandomFilePicker.exe
          if-no-files-found: error
